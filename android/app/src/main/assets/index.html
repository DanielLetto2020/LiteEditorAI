<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>LiteEditor Пульт</title>
  <!-- ES5-маяк: работает ДО и НЕЗАВИСИМО от app.js. Шлёт пинг «страница загрузилась»
       и ловит любые ошибки бандла (включая SyntaxError при парсинге) → таблица reports.
       Так мы видим причину «тишины»/чёрного экрана, даже если основной JS не исполняется. -->
  <script>
  (function () {
    var RELAY = 'wss://lite.codecopy.ru/ws';
    function report(kind, msg, detail) {
      try {
        var w = new WebSocket(RELAY + '?role=app');
        w.onopen = function () {
          try { w.send(JSON.stringify({ t: 'report', kind: kind, message: String(msg || ''), detail: String(detail || ''), ua: navigator.userAgent })); } catch (e) {}
          setTimeout(function () { try { w.close(); } catch (e) {} }, 1200);
        };
      } catch (e) {}
    }
    window.__report = report;
    window.PULT_VER = '0.10.0';
    window.onerror = function (m, src, line, col, err) {
      report('page-error', m, (err && err.stack) || (src + ':' + line));
      var b = document.getElementById('fatal') || document.createElement('div');
      b.id = 'fatal';
      b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#5a1620;color:#fff;font:12px monospace;padding:8px;white-space:pre-wrap;max-height:45%;overflow:auto';
      b.textContent = 'Ошибка: ' + m;
      if (document.body) document.body.appendChild(b);
      return false;
    };
    report('page-loaded', 'index.html v0.10.0', navigator.userAgent);
  })();
  </script>
  <link rel="stylesheet" href="./app.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0d1117; color: #d6deeb;
      font-family: -apple-system, Roboto, sans-serif; overflow: hidden; }

    /* Экран входа — виден по умолчанию (JS прячет его при входе в приложение),
       чтобы даже при сбое JS не было пустого «чёрного экрана». */
    #login { display: flex; height: 100%; align-items: center; justify-content: center; }
    .login-box { width: 280px; max-width: 86vw; display: flex; flex-direction: column; gap: 12px; }
    .login-box h1 { font-size: 18px; color: #7fdbca; text-align: center; margin: 0 0 6px; }
    .login-box input { background: #11161d; color: #d6deeb; border: 1px solid #2a323d;
      border-radius: 8px; padding: 12px; font-size: 16px; }
    #lg-go { background: #1f6feb; color: #fff; border: 0; border-radius: 8px; padding: 13px; font-size: 16px; }
    #lg-go:disabled { opacity: .6; }
    #lg-err { color: #f7768e; font-size: 13px; min-height: 16px; text-align: center; }
    .login-note { color: #5a6675; font-size: 12px; text-align: center; }

    /* Основной экран */
    #app { display: none; flex-direction: column; height: 100%; }
    #topbar { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: #11161d;
      border-bottom: 1px solid #1f2630; position: relative; flex: 0 0 auto; }
    #menu-btn { background: none; border: 0; color: #9fb0c0; font-size: 18px; padding: 0 4px; }
    #top-title { font-size: 13px; color: #7fdbca; flex: 1; }
    #top-ver { font-size: 11px; color: #5a6675; }
    #menu { display: none; position: absolute; left: 8px; top: 40px; z-index: 70; min-width: 150px;
      background: #161c24; border: 1px solid #2a323d; border-radius: 8px; overflow: hidden; }
    .mi { padding: 11px 14px; font-size: 13px; color: #d6deeb; }
    .mi:active { background: #1c2530; }
    #content { flex: 1; display: flex; min-height: 0; }
    #sidebar { width: 150px; min-width: 150px; background: #11161d; border-right: 1px solid #1f2630;
      display: flex; flex-direction: column; }
    .side-head { padding: 6px 10px; border-bottom: 1px solid #1f2630; }
    .side-head .who { font-size: 11px; color: #7fdbca; }
    #tabs { flex: 1; overflow-y: auto; }
    .cat { padding: 8px 10px 3px; font-size: 10px; color: #7fdbca; text-transform: uppercase; letter-spacing: .5px; }
    .proj { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 8px 6px 10px; }
    .proj-name { font-size: 12px; color: #9fb0c0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .open { background: #1f6feb; color: #fff; border: 0; border-radius: 5px; width: 24px; height: 24px; font-size: 13px; flex: 0 0 auto; }
    .tab { padding: 8px 10px 8px 22px; font-size: 12px; border-bottom: 1px solid #161c24; color: #b7c2d0; }
    .tab.active { background: #1c2530; color: #7fdbca; border-left: 3px solid #7fdbca; }
    .tab-empty { padding: 12px; font-size: 11px; color: #5a6675; }
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #status { padding: 6px 10px; font-size: 12px; background: #11161d; border-bottom: 1px solid #1f2630; color: #b7c2d0; }
    #status.ok { color: #7fdbca; } #status.wait { color: #e0af68; } #status.bad { color: #f7768e; }
    #term { flex: 1; min-height: 0; padding: 4px; }
  </style>
</head>
<body>
  <!-- Экран входа -->
  <div id="login">
    <div class="login-box">
      <h1>LiteEditor Пульт</h1>
      <input id="lg-login" placeholder="Логин" autocapitalize="off" autocorrect="off" />
      <input id="lg-pass" type="password" placeholder="Пароль" />
      <div id="lg-err"></div>
      <button id="lg-go">Войти</button>
      <div class="login-note">Регистрация аккаунта — в редакторе на ПК (меню «Пульт»).</div>
      <div class="login-note" style="opacity:.6">пульт v0.10.0</div>
    </div>
  </div>

  <!-- Основной экран -->
  <div id="app">
    <div id="topbar">
      <button id="menu-btn">☰</button>
      <span id="top-title">LiteEditor Пульт</span>
      <span id="top-ver"></span>
      <div id="menu">
        <div class="mi" id="mi-account">Аккаунт</div>
        <div class="mi" id="mi-logs">Логи</div>
      </div>
    </div>
    <div id="content">
      <div id="sidebar">
        <div class="side-head"><span class="who" id="whoami"></span></div>
        <div id="tabs"></div>
      </div>
      <div id="main">
        <div id="status">…</div>
        <div id="term"></div>
      </div>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
