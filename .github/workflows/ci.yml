name: CI

# Lightweight checks on every push / PR: pure-Node unit tests (shell selection,
# anti-traversal name guard, read-only SQL filter) + a syntax/bundle smoke check.
# These run WITHOUT Electron — no node-pty rebuild, no display — so they're fast.
#
# The same four gates run locally via .claude/gauntlet.json (std-gauntlet).
# Keep both in sync: a gate that only exists on one side stops being trusted.
on:
  push:
    branches: [main, contrib]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Unit tests (pure Node, no Electron)
        run: npm test
      - name: Syntax check (main/preload/errledger)
        run: node -c main.js && node -c preload.js && node -c errledger.js
      - name: Install deps + bundle frontend
        run: npm ci --ignore-scripts && npm run build
      - name: Lint
        run: npm run lint
      - name: Types (JSDoc via tsc, see tsconfig.check.json)
        run: npm run typecheck
      # Mutation testing scores the tests themselves. The local ratchet state lives in
      # .claude/ and is not committed, so CI enforces a fixed floor instead.
      - name: Mutation testing
        run: npm run mutation
        env:
          MUTATION_MIN: 79
