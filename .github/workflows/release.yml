name: Release

# Builds installers on a pushed tag (v*) and attaches them to the GitHub Release.
# Только Linux: .deb + portable tar.gz.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Релизы — ТОЛЬКО Linux (с v1.1.214): .deb и портативный tar.gz.
          # Строго ubuntu-24.04 (не ubuntu-latest = 26.04!): иначе node-pty линкуется с GLIBC_2.42
          # и падает при запуске на Ubuntu 22.04 / 24.04 и Debian 12.
          - os: ubuntu-24.04
            target: --linux deb tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps (rebuilds node-pty for this OS)
        run: npm ci

      - name: Preflight (version sync, i18n, build.files whitelist)
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const tag = (process.env.GITHUB_REF_NAME || '').replace(/^v/, '');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const pkgVer = pkg.version.replace(/-alpha$/, '');
            if (tag && tag !== pkgVer) throw new Error('Tag ' + tag + ' != package.json ' + pkgVer);
            const rend = fs.readFileSync('renderer/renderer.js', 'utf8');
            const m = /APP_VERSION\s*=\s*'alpha v([^']+)'/.exec(rend);
            if (!m || m[1] !== pkgVer) throw new Error('APP_VERSION != package.json ' + pkgVer);
            const notes = fs.readFileSync('RELEASE_NOTES.md', 'utf8');
            if (tag && !notes.includes('v' + tag)) throw new Error('RELEASE_NOTES.md missing v' + tag);
            for (const f of ['main.js', 'preload.js', 'logger.js', 'errledger.js']) {
              const src = fs.readFileSync(f, 'utf8');
              for (const mm of src.matchAll(/require\((['\"])\.\/([^'\"]+)\1\)/g)) {
                const mod = mm[2].endsWith('.js') ? mm[2] : mm[2] + '.js';
                if (!fs.existsSync(mod)) throw new Error('Missing require target: ' + mod);
              }
            }
            console.log('Preflight OK: v' + pkgVer);
          "
          node scripts/i18n-extract.js --check

      - name: Lint, typecheck and unit tests
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Bundle renderer
        run: node build.js

      - name: Build installers
        # --publish never: electron-builder только собирает; релиз публикуем шагом ниже.
        shell: bash
        run: npx --no-install electron-builder ${{ matrix.target }} --publish never

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          prerelease: false                 # помечать как Latest (не Pre-release)
          body_path: RELEASE_NOTES.md        # тело релиза — из файла в репо (единый источник, см. CHANGELOG.md)
          files: |
            dist-release/*.deb
            dist-release/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
