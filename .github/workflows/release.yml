name: Release

# Builds installers on a pushed tag (v*) and attaches them to the GitHub Release.
# Только Linux: .deb + portable tar.gz.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Релизы — ТОЛЬКО Linux (с v1.1.214): .deb и портативный tar.gz. Windows и macOS не собираются.
          - os: ubuntu-latest
            target: --linux deb tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps (rebuilds node-pty for this OS)
        run: npm ci

      - name: Bundle renderer
        run: node build.js

      - name: Build installers
        # --publish never: electron-builder только собирает; релиз публикуем шагом ниже.
        shell: bash
        run: npx --no-install electron-builder ${{ matrix.target }} --publish never

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          prerelease: false                 # помечать как Latest (не Pre-release)
          body_path: RELEASE_NOTES.md        # тело релиза — из файла в репо (единый источник, см. CHANGELOG.md)
          files: |
            dist-release/*.deb
            dist-release/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
