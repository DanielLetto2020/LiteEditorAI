<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' file: blob:; img-src 'self' data: file: https: http:; frame-src 'self' file:;" />
  <title>LiteEditorAI — модуль</title>
  <link rel="stylesheet" href="dist/module-bundle.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="neumorphism" class="module-window">
  <!-- Окно одного модуля (v1.1+): титлбар + единственная панель, которая заполняет окно. -->
  <div id="mod-app">
    <header id="mod-topbar">
      <span class="brand"><span class="brand-mark">▍</span><span id="mod-brand-title">Модуль</span></span>
      <div class="drag-space"></div>
      <div class="win-tools">
        <button id="win-min" class="win-btn" title="Свернуть" aria-label="Свернуть"></button>
        <button id="win-max" class="win-btn" title="Развернуть" aria-label="Развернуть"></button>
        <button id="win-close" class="win-btn close" title="Закрыть" aria-label="Закрыть"></button>
      </div>
    </header>

    <!-- Скелеты панелей модулей переезжают сюда из index.html (по одному модулю на окно). -->
    <div id="module-root">
      <!-- OpenRouter chat: чат по своим API-ключам (самостоятельный) -->
      <div id="gutter-chat" class="gutter hidden" data-resize="chat"></div>
      <section id="chat-pane" class="hidden">
        <div class="pane-head">
          <span id="chat-title" class="chat-title">OpenRouter</span>
          <div class="drag-space-static"></div>
          <button id="chat-keys" class="icon-btn" title="Управление ключами" data-icon="sliders"></button>
          <button id="chat-close" class="icon-btn" title="Закрыть" data-icon="x"></button>
        </div>
        <div id="chat-tabs" class="chat-tabs"></div><!-- вкладка на каждый ключ (рендерит openrouter.js) -->
        <div id="chat-top">
          <div id="chat-session-wrap" class="chat-session-wrap">
            <button id="chat-session-btn" class="chat-session-btn" type="button" title="Сессии этого ключа">☰ Сессия 1</button>
            <div id="chat-session-pop" class="chat-session-pop hidden"></div>
          </div>
          <div id="chat-model-wrap" class="chat-model-wrap">
            <button id="chat-model-btn" class="chat-model-btn" type="button">Выбрать модель…</button>
            <div id="chat-model-pop" class="chat-model-pop hidden">
              <input id="chat-model-search" type="text" placeholder="Поиск модели…" autocomplete="off" spellcheck="false">
              <div id="chat-model-list" class="chat-model-list"></div>
            </div>
          </div>
          <div class="chat-ctx" title="Сколько последних сообщений отправлять модели (1–100)">
            <label for="chat-ctx-input">контекст</label>
            <input id="chat-ctx-input" type="number" min="1" max="100" value="10">
          </div>
          <span id="chat-usage" class="or-usage-text chat-usage" title="Баланс активного ключа"></span>
          <button id="chat-usage-refresh" class="or-refresh" title="Обновить баланс ключа" data-icon="refresh" data-icon-size="13"></button>
        </div>
        <div id="chat-log" class="chat-log"></div>
        <div id="chat-input-row" class="chat-input-row">
          <textarea id="chat-input" rows="1" placeholder="Сообщение…  (Enter — отправить, Shift+Enter — перенос строки)" spellcheck="false"></textarea>
          <button id="chat-send" class="btn primary chat-send" type="button" title="Отправить">▶</button>
        </div>
      </section>

      <!-- Обработка текста: документы + AI-правки фрагментов (renderer/modules/textproc.js) -->
      <div id="gutter-doc" class="gutter hidden" data-resize="doc"></div>
      <section id="doc-pane" class="hidden">
        <div class="pane-head">
          <span id="doc-title" class="doc-title">Обработка текста</span>
          <div class="drag-space-static"></div>
          <span id="doc-saved" class="doc-saved"></span>
          <button id="doc-settings" class="icon-btn" title="Промпты и агент" data-icon="sliders"></button>
          <button id="doc-close" class="icon-btn" title="Закрыть" data-icon="x"></button>
        </div>
        <div id="doc-tabs" class="doc-tabs"></div><!-- вкладка на каждый документ (рендерит textproc.js) -->
        <div id="doc-toolbar">
          <div id="doc-modes" class="doc-modes"></div>
        </div>
        <div id="doc-body" class="doc-body">
          <div id="doc-editor" class="doc-editor"></div>
          <div id="doc-preview" class="doc-preview prev-md" style="display:none"></div>
          <button id="doc-ai-btn" class="doc-ai-btn" type="button" style="display:none">✦ AI</button>
        </div>
      </section>

      <!-- Git module: репозиторий активного проекта (следует за активным проектом редактора) -->
      <div id="gutter-git" class="gutter hidden" data-resize="git"></div>
      <section id="git-pane" class="hidden">
        <div class="pane-head">
          <span id="git-proj">Git</span>
          <div class="drag-space-static"></div>
          <button id="git-refresh" class="icon-btn" title="Обновить" data-icon="refresh"></button>
          <button id="git-close" class="icon-btn" title="Закрыть Git" data-icon="x"></button>
        </div>
        <div id="git-body" class="git-body"></div>
      </section>

      <!-- Databases module (Postgres/MySQL/SQLite): system-wide -->
      <div id="gutter-db" class="gutter hidden" data-resize="db"></div>
      <section id="db-pane" class="hidden">
        <div class="pane-head">
          <span id="db-title">Базы данных</span>
          <div class="drag-space-static"></div>
          <button id="db-refresh" class="icon-btn" title="Обновить" data-icon="refresh"></button>
          <button id="db-close" class="icon-btn" title="Закрыть" data-icon="x"></button>
        </div>
        <div id="db-body" class="db-body"></div>
      </section>

      <!-- Notes/tasks module: задачи активного проекта + общие (следует за активным проектом редактора) -->
      <div id="gutter-notes" class="gutter hidden" data-resize="notes"></div>
      <section id="notes-pane" class="hidden">
        <div class="pane-head">
          <span id="notes-proj">Задачи</span>
          <div class="drag-space-static"></div>
          <button id="notes-export" class="icon-btn" title="Экспорт заметок в JSON" data-icon="download"></button>
          <button id="notes-import" class="icon-btn" title="Импорт заметок из JSON" data-icon="upload"></button>
          <button id="notes-close" class="icon-btn" title="Закрыть" data-icon="x"></button>
        </div>
        <div id="notes-body" class="notes-body"></div>
      </section>

      <!-- Audit module: базовый аудит активного проекта (следует за активным проектом редактора) -->
      <div id="gutter-audit" class="gutter hidden" data-resize="audit"></div>
      <section id="audit-pane" class="hidden">
        <div class="pane-head">
          <span id="audit-proj">Аудит проекта</span>
          <div class="drag-space-static"></div>
          <button id="audit-rescan" class="icon-btn" title="Пересканировать проект" data-icon="refresh"></button>
          <button id="audit-close" class="icon-btn" title="Закрыть" data-icon="x"></button>
        </div>
        <div id="audit-body" class="audit-body"></div>
      </section>
      <!-- Tools module: devtools-комбайн (base64/JSON↔YAML/хэши/JWT/regex/diff…) -->
      <div id="gutter-tools" class="gutter hidden" data-resize="tools"></div>
      <section id="tools-pane" class="hidden">
        <div class="pane-head">
          <span>Инструменты</span>
          <div class="drag-space-static"></div>
          <button id="tools-close" class="icon-btn" title="Закрыть" data-icon="x"></button>
        </div>
        <div id="tools-body" class="tools-body"></div>
      </section>

      <!-- IterFlow module: таск-трекер исполнителя (отдельный продукт через /api/editor/*) -->
      <div id="gutter-iterflow" class="gutter hidden" data-resize="iterflow"></div>
      <section id="iterflow-pane" class="hidden">
        <div class="pane-head">
          <span id="iterflow-proj">IterFlow</span>
          <div class="drag-space-static"></div>
          <button id="iterflow-site" class="icon-btn" title="Открыть сайт IterFlow" data-icon="globe"></button>
          <button id="iterflow-refresh" class="icon-btn" title="Обновить" data-icon="refresh"></button>
          <button id="iterflow-logout" class="icon-btn" title="Выйти из IterFlow" data-icon="logout"></button>
          <button id="iterflow-close" class="icon-btn" title="Закрыть" data-icon="x"></button>
        </div>
        <div id="iterflow-body" class="iterflow-body"></div>
      </section>

      <!-- WEB/SEO audit module: аудит сайта (локальный dev-сервер или внешний домен) -->
      <div id="gutter-seo" class="gutter hidden" data-resize="seo"></div>
      <section id="seo-pane" class="hidden">
        <div class="pane-head">
          <span id="seo-proj">WEB/SEO аудит</span>
          <div class="drag-space-static"></div>
          <button id="seo-rescan" class="icon-btn" title="Пересканировать сайт" data-icon="refresh"></button>
          <button id="seo-close" class="icon-btn" title="Закрыть" data-icon="x"></button>
        </div>
        <div id="seo-body" class="seo-body"></div>
      </section>
    </div>
  </div>

  <div id="menu-layer"></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>

  <script src="dist/module-bundle.js"></script>
</body>
</html>
